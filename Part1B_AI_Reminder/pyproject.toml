[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reminder-agent"
version = "0.1.0"
description = "Structured, safety-conscious reminder request extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
reminder-evaluate = "ai_reminder_agent.evaluation_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
